# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Set values specific to:
#   salt['config.get']('os_family') == RedHat.
#
# You just need to add the key:values for this `os_family` that differ
# from `defaults.yaml` + `<osarch>.yaml`.
#
# If you do not need to provide defaults via the `os_family` config,
# you can remove this file or provide at least an empty dict, e.g.
# values: {}
---
values:
  config: /etc/claude_code.conf
  install_method: script
  install_script:
    creates: /usr/local/bin/claude
    env:
      CLAUDE_INSTALL_ALLOW_SUDO: '1'
    group: root
    mode: '0755'
    skip_verify: true
    source: https://claude.ai/install.sh
    source_hash: null
    target: /tmp/claude_code_install.sh
    user: root
  path:
    global_bin: /usr/local/bin/claude
    global_share: /usr/local/share/claude
    root_bin: /root/.local/bin/claude
    root_share: /root/.local/share/claude
  pkg:
    deps:
      - ca-certificates
      - curl
      - git
      - gzip
      - procps-ng
      - tar
    nodejs:
      name: nodejs
    npm:
      name: '@anthropic-ai/claude-code'
...
